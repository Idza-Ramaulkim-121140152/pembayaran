<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta http-equiv="pragma" content="no-cache">
<meta http-equiv="expires" content="-1">
<title>Error Hotspot - Rumah Kita Net</title>
<style>
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: #0f172a;
    min-height: 100vh;
    margin: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 18px;
  }
  .card {
    background: #fff;
    border-radius: 20px;
    padding: 26px 22px;
    max-width: 380px;
    width: 100%;
    text-align: center;
  }
  h1 { font-size: 18px; color: #b91c1c; margin: 0 0 10px; }
  p { font-size: 13.5px; color: #475569; margin: 0 0 18px; }
  a {
    display: inline-block;
    padding: 12px 22px;
    background: #2563eb;
    color: #fff;
    border-radius: 12px;
    text-decoration: none;
    font-size: 14px;
    font-weight: 700;
  }
</style>
</head>
<body>
<div class="card">
  <h1>Terjadi Kendala Hotspot</h1>
  <p>$(error)</p>
  <a href="$(link-login)">Kembali ke Halaman Login</a>
</div>
</body>
</html>
