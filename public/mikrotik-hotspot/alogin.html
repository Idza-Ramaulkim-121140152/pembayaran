<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta http-equiv="refresh" content="1; url=$(link-status)">
<meta http-equiv="pragma" content="no-cache">
<meta http-equiv="expires" content="-1">
<title>Berhasil Login - Rumah Kita Net</title>
<style>
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: linear-gradient(135deg, #0f172a, #1e3a8a);
    min-height: 100vh;
    margin: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 18px;
  }
  .card {
    background: #fff;
    border-radius: 20px;
    padding: 28px 24px;
    max-width: 360px;
    width: 100%;
    text-align: center;
    box-shadow: 0 20px 50px rgba(0, 0, 0, 0.3);
  }
  .check {
    width: 56px;
    height: 56px;
    border-radius: 50%;
    background: #dcfce7;
    color: #16a34a;
    font-size: 28px;
    line-height: 56px;
    margin: 0 auto 14px;
    font-weight: 800;
  }
  h1 { font-size: 19px; color: #0f172a; margin: 0 0 8px; }
  p { font-size: 13.5px; color: #64748b; margin: 0 0 16px; }
  a {
    display: inline-block;
    padding: 10px 20px;
    background: #2563eb;
    color: #fff;
    border-radius: 12px;
    text-decoration: none;
    font-size: 13.5px;
    font-weight: 700;
  }
</style>
</head>
<body>
<div class="card">
  <div class="check">&#10003;</div>
  <h1>Anda Sudah Terhubung!</h1>
  <p>Membuka informasi status &amp; sisa waktu voucher Anda...</p>
  <a href="$(link-status)">Lihat Status &amp; Sisa Waktu</a>
</div>
<script type="text/javascript">
  setTimeout(function () {
    window.location.href = "$(link-status)";
  }, 800);
</script>
</body>
</html>
